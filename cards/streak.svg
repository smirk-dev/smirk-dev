<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="GitHub contribution streak">
<title>smirk-dev: 10,499 contributions, current streak 10, longest 124</title>
<style>
  text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif}
  .num{font-size:28px;font-weight:700}
  .lbl{font-size:14px;font-weight:400}
  .dt{font-size:12px;font-weight:400}
  @keyframes f{from{opacity:0}to{opacity:1}}
