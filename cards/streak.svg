    <circle cx="247.5" cy="71" r="40" fill="none" stroke="#B347FF" stroke-width="5" mask="url(#ringGap)"/>
    <path transform="translate(236.5 20)" fill="#B347FF" d="M11 0C11 0 3 7.5 3 14.2C3 18.6 6.6 22 11 22C15.4 22 19 18.6 19 14.2C19 10.5 16.6 7.3 15.3 6C15.3 9 13.6 10.8 12 11.2C13 7.6 12.4 3.3 11 0Z"/>
    <text x="247.5" y="83" class="num a" fill="#FFFFFF" style="animation-delay:.4s">10</text>
    <text x="247.5" y="139" class="lbl a" fill="#B347FF" font-weight="700" style="animation-delay:.5s">Current Streak</text>
    <text x="247.5" y="160" class="dt a" fill="#c9d1d9" style="animation-delay:.6s">Nov 10 - Nov 19</text>
  </g>
  <g class="a" style="animation-delay:.7s">
    <text x="412.5" y="79" class="num" fill="#B347FF">124</text>
    <text x="412.5" y="114" class="lbl" fill="#c9d1d9">Longest Streak</text>
    <text x="412.5" y="139" class="dt" fill="#c9d1d9">Jun 4, 2025 - Oct 5, 2025</text>
