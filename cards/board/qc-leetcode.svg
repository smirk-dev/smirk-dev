<style>@font-face{font-family:JBM;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:JBM;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:RJD;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
