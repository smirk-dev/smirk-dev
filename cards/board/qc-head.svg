<svg xmlns="http://www.w3.org/2000/svg" width="800" height="44" viewBox="0 0 800 44" role="img" aria-label="Achievements">
<title>Achievements</title>
<style>@font-face{font-family:JBM;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:JBM;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:JBM, 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#c9d1d9}
.d{font-family:RJD, Rajdhani, JBM, ui-monospace, Consolas, monospace;font-weight:700}
.b{font-weight:700}
@keyframes bk{50%{opacity:0}}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes gl{0%,90%,100%{transform:translate(0,0)}91%{transform:translate(-3px,1px)}93%{transform:translate(3px,-1px)}95%{transform:translate(-1px,0)}}
@keyframes dr{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
.bk{animation:bk 1.1s steps(1) infinite}
.pl{animation:pl 2.4s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12"/></filter>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="#B347FF" fill-opacity=".16"/></pattern>
</defs>
<rect x=".5" y=".5" width="799" height="43" rx="6" fill="#0b0713" stroke="#2f1a4d"/>
<text x="20" y="27" font-size="11" letter-spacing="2" fill="#8b949e" ><tspan fill="#B347FF">■</tspan> QC // ACHIEVEMENTS</text>
<text x="780" y="27" font-size="11" letter-spacing="2" text-anchor="end" fill="#8b949e">PRESS A TEST POINT TO OPEN ITS FULL SET</text>
</svg>
